<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孔雀翎 Malachite</title>
<style>
  :root {
    --bg: #05070c;
    --txt: #eef2f7;
    --txt2: #8b96a8;
    --txt3: #4d5768;
    --em: #2dd4a0;
    --cy: #43c6e8;
    --gd: #e8c15a;
    --mg: #c857d8;
    --glass: rgba(14,20,30,.55);
    --line: rgba(120,160,200,.14);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--txt); font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; overflow:hidden; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }

  /* ── 背景：极光 + 星尘 + 地平网格 ── */
  .bg { position:fixed; inset:0; z-index:0; overflow:hidden; }
  .aur { position:absolute; border-radius:50%; filter:blur(90px); opacity:.5; mix-blend-mode:screen; }
  .aur.a1 { width:56vw; height:56vw; left:-12vw; top:-18vw; background:radial-gradient(circle, rgba(45,212,160,.32), transparent 65%); animation:drift1 26s ease-in-out infinite alternate; }
  .aur.a2 { width:48vw; height:48vw; right:-10vw; top:-6vw; background:radial-gradient(circle, rgba(67,198,232,.28), transparent 65%); animation:drift2 32s ease-in-out infinite alternate; }
  .aur.a3 { width:44vw; height:44vw; left:28vw; bottom:-24vw; background:radial-gradient(circle, rgba(200,87,216,.18), transparent 65%); animation:drift3 38s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform:translate(9vw,7vh) scale(1.15); } }
  @keyframes drift2 { to { transform:translate(-8vw,9vh) scale(1.08); } }
  @keyframes drift3 { to { transform:translate(6vw,-8vh) scale(1.12); } }
  .stars { position:absolute; inset:0; background-image:
    radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 32% 68%, rgba(160,220,255,.4), transparent 60%),
    radial-gradient(1.5px 1.5px at 55% 15%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1px 1px at 71% 42%, rgba(255,220,180,.4), transparent 60%),
    radial-gradient(1px 1px at 84% 75%, rgba(160,255,220,.35), transparent 60%),
    radial-gradient(1.5px 1.5px at 91% 24%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 45% 85%, rgba(200,180,255,.35), transparent 60%),
    radial-gradient(1px 1px at 22% 48%, rgba(255,255,255,.3), transparent 60%);
    animation:twinkle 7s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity:.55; } to { opacity:1; } }
  .grid { position:absolute; left:-30vw; right:-30vw; bottom:-12vh; height:44vh;
    background:
      linear-gradient(transparent 0, rgba(45,212,160,.09) 100%) ,
      repeating-linear-gradient(90deg, rgba(67,198,232,.14) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(0deg, rgba(67,198,232,.14) 0 1px, transparent 1px 44px);
    transform:perspective(560px) rotateX(62deg);
    mask-image:linear-gradient(transparent, black 55%);
    animation:gridflow 9s linear infinite;
  }
  @keyframes gridflow { from { background-position:0 0, 0 0, 0 0; } to { background-position:0 0, 0 0, 0 44px; } }

  /* ── 顶栏 ── */
  header { position:relative; z-index:2; flex:none; display:flex; align-items:center; justify-content:space-between; padding:24px 32px; }
  .logo { display:flex; align-items:center; gap:11px; user-select:none; }
  .logo .pt { width:9px; height:9px; border-radius:50%; background:linear-gradient(135deg,var(--em),var(--cy)); box-shadow:0 0 16px rgba(45,212,160,.8); }
  .logo b { font-size:16px; font-weight:700; letter-spacing:3px; background:linear-gradient(90deg,#fff,#bfe8d8); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .logo span { font-size:10px; color:var(--txt3); font-family:Consolas,monospace; letter-spacing:3px; }
  .hright { display:flex; align-items:center; gap:16px; }
  .status { font-size:11px; color:var(--txt2); display:flex; align-items:center; gap:7px; padding:5px 13px; border-radius:14px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(10px); }
  .status i { width:6px; height:6px; border-radius:50%; background:var(--em); box-shadow:0 0 8px var(--em); animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.4; } }
  .avatar { width:32px; height:32px; border-radius:50%; background:conic-gradient(from 210deg, var(--em), var(--cy), var(--mg), var(--em)); padding:2px; }
  .avatar::after { content:""; display:block; width:100%; height:100%; border-radius:50%; background:#0c1119; }

  /* ── 主区 ── */
  main { position:relative; z-index:2; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 24px 44px; min-height:0; }

  .dropzone { width:min(500px, 80%); margin-bottom:26px; display:none; }
  .dropzone.has { display:block; animation:pop .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform:scale(.92); opacity:0; } }
  .dz-frame { position:relative; width:100%; aspect-ratio:3/2; border-radius:16px; overflow:hidden; border:1px solid rgba(45,212,160,.4); box-shadow:0 0 0 1px rgba(45,212,160,.15), 0 24px 70px rgba(0,0,0,.6), 0 0 44px rgba(45,212,160,.12); background:#0a0f16; }
  .dz-frame img { width:100%; height:100%; object-fit:contain; display:block; }
  .dz-tag { position:absolute; bottom:11px; left:11px; font-size:11px; color:#cfe8dd; background:rgba(6,10,16,.7); backdrop-filter:blur(8px); padding:3px 11px; border-radius:11px; border:1px solid var(--line); max-width:70%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dz-x { position:absolute; top:11px; right:11px; width:27px; height:27px; border-radius:50%; background:rgba(6,10,16,.7); border:1px solid var(--line); color:var(--txt2); display:grid; place-items:center; cursor:pointer; font-size:12px; backdrop-filter:blur(8px); }
  .dz-x:hover { color:#fff; border-color:rgba(255,120,120,.5); }

  .hero { text-align:center; margin-bottom:40px; }
  .hero .eyebrow { font-size:11px; letter-spacing:6px; color:var(--em); opacity:.75; margin-bottom:16px; font-family:Consolas,monospace; }
  .hero h1 { font-size:40px; font-weight:700; letter-spacing:14px; text-indent:14px;
    background:linear-gradient(100deg, #fff 15%, #9be8c8 40%, #7fd4f0 60%, #e8c15a 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 26px rgba(45,212,160,.25));
    animation:shine 8s ease-in-out infinite alternate;
    background-size:200% 100%;
  }
  @keyframes shine { to { background-position:100% 0; } }
  .hero p { margin-top:16px; font-size:13.5px; color:var(--txt2); letter-spacing:2px; }
  .hero p b { color:var(--em); font-weight:500; }

  /* ── 对话输入 ── */
  .chat { width:min(700px, 92%); }
  .chat-box { position:relative; border-radius:20px; padding:1px; background:linear-gradient(120deg, rgba(45,212,160,.55), rgba(67,198,232,.3) 40%, rgba(120,140,170,.2) 70%, rgba(200,87,216,.35)); transition:filter .25s, box-shadow .25s; }
  .chat-box::before { content:""; position:absolute; inset:-2px; border-radius:21px; background:inherit; filter:blur(14px); opacity:.35; z-index:-1; transition:opacity .25s; }
  .chat-box:hover::before, .chat-box:focus-within::before { opacity:.7; }
  .chat-box.dragover { filter:brightness(1.3); }
  .chat-in { background:linear-gradient(160deg, rgba(13,19,29,.92), rgba(9,13,20,.94)); backdrop-filter:blur(14px); border-radius:19px; }
  .chat-input { display:flex; align-items:flex-end; gap:10px; padding:16px 18px 10px; }
  .chat-input textarea { flex:1; background:none; border:none; outline:none; resize:none; color:var(--txt); font:inherit; font-size:14.5px; line-height:1.55; max-height:130px; }
  .chat-input textarea::placeholder { color:var(--txt3); }
  .chat-foot { display:flex; align-items:center; gap:6px; padding:8px 12px 13px; }
  .icon-btn { height:32px; padding:0 13px; border-radius:10px; display:flex; align-items:center; gap:7px; color:var(--txt2); cursor:pointer; font-size:12.5px; transition:all .14s; border:1px solid transparent; background:none; font-family:inherit; }
  .icon-btn:hover { background:rgba(120,160,200,.08); color:var(--txt); border-color:var(--line); }
  .send { margin-left:auto; width:36px; height:36px; border-radius:50%; border:none; background:linear-gradient(135deg,var(--em),var(--cy)); color:#04120c; font-size:16px; cursor:pointer; display:grid; place-items:center; font-weight:700; box-shadow:0 0 18px rgba(45,212,160,.4); transition:all .15s; }
  .send:hover { box-shadow:0 0 30px rgba(45,212,160,.65); transform:translateY(-1px); }
  .send:active { transform:scale(.94); }
  .send.disabled { background:rgba(120,140,170,.15); color:var(--txt3); box-shadow:none; cursor:default; }

  .hints { display:flex; justify-content:center; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .hint { font-size:12px; color:var(--txt2); border:1px solid var(--line); border-radius:14px; padding:6px 15px; cursor:pointer; transition:all .16s; background:var(--glass); backdrop-filter:blur(8px); }
  .hint:hover { color:#d8f5ea; border-color:rgba(45,212,160,.45); box-shadow:0 0 16px rgba(45,212,160,.15); transform:translateY(-1px); }
  .hint::before { content:"◈ "; color:var(--em); opacity:.7; }

  .veil { position:fixed; inset:0; z-index:99; display:none; place-items:center; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(45,212,160,.07), rgba(5,7,12,.4));
    border:2px solid rgba(45,212,160,.55); box-shadow:inset 0 0 90px rgba(45,212,160,.15); }
  .veil.on { display:grid; }
  .veil span { font-size:16px; letter-spacing:4px; color:var(--em); text-shadow:0 0 20px rgba(45,212,160,.6); }
</style>
</head>
<body>

<div class="bg">
  <div class="aur a1"></div><div class="aur a2"></div><div class="aur a3"></div>
  <div class="stars"></div>
  <div class="grid"></div>
</div>

<header>
  <div class="logo"><div class="pt"></div><b>孔雀翎</b><span>MALACHITE</span></div>
  <div class="hright">
    <span class="status"><i></i>本机集群 · 就绪</span>
    <div class="avatar"></div>
  </div>
</header>

<main>
  <div class="dropzone" id="dz">
    <div class="dz-frame">
      <img id="dzImg" src="" alt="">
      <div class="dz-tag" id="dzTag">参考图</div>
      <div class="dz-x" onclick="clearDz()">✕</div>
    </div>
  </div>

  <div class="hero" id="hero">
    <div class="eyebrow">OPEN SOURCE · AIGC CANVAS</div>
    <h1>孔雀翎</h1>
    <p>说出你想要的画面，或<b>拖入一张图</b> — 智能体开始工作</p>
  </div>

  <div class="chat">
    <div class="chat-box" id="box">
      <div class="chat-in">
        <div class="chat-input">
          <textarea id="ta" rows="1" placeholder="描述你想要的图像…（支持拖入图片）"></textarea>
        </div>
        <div class="chat-foot">
          <button class="icon-btn" id="pick" title="上传图片">🖼 图片</button>
          <button class="icon-btn" title="工作流">⚙ 工作流</button>
          <button class="send disabled" id="send" title="发送">↑</button>
        </div>
      </div>
    </div>
    <div class="hints">
      <span class="hint">将军水墨立绘，背景留白</span>
      <span class="hint">把这张图转成赛博朋克风</span>
      <span class="hint">扩展画布到 16:9</span>
    </div>
  </div>
</main>

<div class="veil" id="veil"><span>松开 · 图片进入对话区</span></div>

<script>
  const ta = document.getElementById('ta');
  const box = document.getElementById('box');
  const send = document.getElementById('send');
  const dz = document.getElementById('dz');
  const dzImg = document.getElementById('dzImg');
  const dzTag = document.getElementById('dzTag');
  const veil = document.getElementById('veil');
  const hero = document.getElementById('hero');

  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 130) + 'px';
    send.classList.toggle('disabled', !ta.value.trim() && !dz.classList.contains('has'));
  });

  document.querySelectorAll('.hint').forEach(h => h.addEventListener('click', () => {
    ta.value = h.textContent.replace('◈ ',''); ta.dispatchEvent(new Event('input')); ta.focus();
  }));

  function clearDz() {
    dz.classList.remove('has'); dzImg.src = '';
    hero.style.display = '';
    send.classList.toggle('disabled', !ta.value.trim());
  }

  function setImage(file) {
    const r = new FileReader();
    r.onload = e => {
      dzImg.src = e.target.result;
      dzTag.textContent = file.name;
      dz.classList.add('has');
      hero.style.display = 'none';
      send.classList.remove('disabled');
    };
    r.readAsDataURL(file);
  }

  let dragDepth = 0;
  window.addEventListener('dragenter', e => {
    e.preventDefault(); dragDepth++;
    if (e.dataTransfer.types.includes('Files')) { veil.classList.add('on'); box.classList.add('dragover'); }
  });
  window.addEventListener('dragleave', e => {
    e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; veil.classList.remove('on'); box.classList.remove('dragover'); }
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault(); dragDepth = 0; veil.classList.remove('on'); box.classList.remove('dragover');
    const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
    if (f) setImage(f);
  });

  document.getElementById('pick').addEventListener('click', () => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = 'image/*';
    i.onchange = () => i.files[0] && setImage(i.files[0]);
    i.click();
  });
</script>
</body>
</html>
