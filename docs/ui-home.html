<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孔雀翎 Malachite</title>
<style>
  :root {
    --bg: #05070c;
    --txt: #eef2f7;
    --txt2: #6b7688;
    --txt3: #3d4655;
    --em: #2dd4a0;
    --cy: #43c6e8;
    --gd: #e8c15a;
    --mg: #c857d8;
    --glass: rgba(14,20,30,.55);
    --line: rgba(120,160,200,.14);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--txt); font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; overflow:hidden; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }

  /* ── 背景 ── */
  .bg { position:fixed; inset:0; z-index:0; overflow:hidden; }
  .aur { position:absolute; border-radius:50%; filter:blur(90px); opacity:.42; mix-blend-mode:screen; }
  .aur.a1 { width:56vw; height:56vw; left:-12vw; top:-18vw; background:radial-gradient(circle, rgba(45,212,160,.28), transparent 65%); animation:drift1 26s ease-in-out infinite alternate; }
  .aur.a2 { width:48vw; height:48vw; right:-10vw; top:-6vw; background:radial-gradient(circle, rgba(67,198,232,.24), transparent 65%); animation:drift2 32s ease-in-out infinite alternate; }
  .aur.a3 { width:44vw; height:44vw; left:28vw; bottom:-24vw; background:radial-gradient(circle, rgba(200,87,216,.15), transparent 65%); animation:drift3 38s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform:translate(9vw,7vh) scale(1.15); } }
  @keyframes drift2 { to { transform:translate(-8vw,9vh) scale(1.08); } }
  @keyframes drift3 { to { transform:translate(6vw,-8vh) scale(1.12); } }
  .stars { position:absolute; inset:0; opacity:.6; background-image:
    radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1px 1px at 32% 68%, rgba(160,220,255,.35), transparent 60%),
    radial-gradient(1.5px 1.5px at 55% 15%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1px 1px at 71% 42%, rgba(255,220,180,.35), transparent 60%),
    radial-gradient(1px 1px at 84% 75%, rgba(160,255,220,.3), transparent 60%),
    radial-gradient(1.5px 1.5px at 91% 24%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1px 1px at 45% 85%, rgba(200,180,255,.3), transparent 60%),
    radial-gradient(1px 1px at 22% 48%, rgba(255,255,255,.25), transparent 60%);
    animation:twinkle 7s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity:.45; } to { opacity:.75; } }
  .grid { position:absolute; left:-30vw; right:-30vw; bottom:-12vh; height:44vh;
    background:
      linear-gradient(transparent 0, rgba(45,212,160,.08) 100%),
      repeating-linear-gradient(90deg, rgba(67,198,232,.12) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(0deg, rgba(67,198,232,.12) 0 1px, transparent 1px 44px);
    transform:perspective(560px) rotateX(62deg);
    mask-image:linear-gradient(transparent, black 55%);
    animation:gridflow 9s linear infinite;
  }
  @keyframes gridflow { from { background-position:0 0, 0 0, 0 0; } to { background-position:0 0, 0 0, 0 44px; } }

  /* ── 顶栏（低调） ── */
  header { position:relative; z-index:2; flex:none; display:flex; align-items:center; justify-content:space-between; padding:24px 32px; }
  .logo { display:flex; align-items:center; gap:10px; user-select:none; opacity:.8; }
  .logo .pt { width:7px; height:7px; border-radius:50%; background:linear-gradient(135deg,var(--em),var(--cy)); box-shadow:0 0 10px rgba(45,212,160,.6); }
  .logo b { font-size:14px; font-weight:600; letter-spacing:3px; color:#c6cfdb; }
  .logo span { font-size:9px; color:var(--txt3); font-family:Consolas,monospace; letter-spacing:3px; }
  .hright { display:flex; align-items:center; gap:14px; }
  .status { font-size:11px; color:var(--txt3); display:flex; align-items:center; gap:7px; padding:5px 13px; border-radius:14px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(10px); }
  .status i { width:6px; height:6px; border-radius:50%; background:var(--em); box-shadow:0 0 8px var(--em); animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.4; } }
  .avatar { width:30px; height:30px; border-radius:50%; background:conic-gradient(from 210deg, var(--em), var(--cy), var(--mg), var(--em)); padding:2px; opacity:.85; }
  .avatar::after { content:""; display:block; width:100%; height:100%; border-radius:50%; background:#0c1119; }

  /* ── 主区 ── */
  main { position:relative; z-index:2; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 24px 40px; min-height:0; }

  /* 拖入图片位 */
  .dropzone { width:min(500px, 80%); margin-bottom:24px; display:none; }
  .dropzone.has { display:block; animation:pop .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform:scale(.92); opacity:0; } }
  .dz-frame { position:relative; width:100%; aspect-ratio:3/2; border-radius:16px; overflow:hidden; border:1px solid rgba(45,212,160,.4); box-shadow:0 0 0 1px rgba(45,212,160,.15), 0 24px 70px rgba(0,0,0,.6), 0 0 44px rgba(45,212,160,.12); background:#0a0f16; }
  .dz-frame img { width:100%; height:100%; object-fit:contain; display:block; }
  .dz-tag { position:absolute; bottom:11px; left:11px; font-size:11px; color:#cfe8dd; background:rgba(6,10,16,.7); backdrop-filter:blur(8px); padding:3px 11px; border-radius:11px; border:1px solid var(--line); max-width:70%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dz-x { position:absolute; top:11px; right:11px; width:27px; height:27px; border-radius:50%; background:rgba(6,10,16,.7); border:1px solid var(--line); color:var(--txt2); display:grid; place-items:center; cursor:pointer; font-size:12px; backdrop-filter:blur(8px); }
  .dz-x:hover { color:#fff; border-color:rgba(255,120,120,.5); }

  /* 中央孔雀翎：若隐若现 */
  .emblem { position:relative; height:min(38vh, 320px); display:grid; place-items:center; margin-bottom:18px; transition:opacity .5s; }
  .emblem.dim { opacity:.25; }
  .emblem svg { height:100%; width:auto; animation:breathe 6s ease-in-out infinite; filter:drop-shadow(0 0 34px rgba(45,212,160,.22)); }
  @keyframes breathe {
    0%,100% { opacity:.34; transform:scale(1); }
    50% { opacity:.62; transform:scale(1.025); }
  }
  .emblem .ring { position:absolute; width:118%; aspect-ratio:1; border-radius:50%; border:1px solid rgba(45,212,160,.12); animation:ringpulse 6s ease-in-out infinite; }
  @keyframes ringpulse { 0%,100% { transform:scale(.96); opacity:.5; } 50% { transform:scale(1.04); opacity:1; } }

  .hero { text-align:center; margin-bottom:34px; }
  .hero h1 { font-size:17px; font-weight:500; letter-spacing:10px; text-indent:10px; color:#8a95a6; }
  .hero p { margin-top:9px; font-size:12.5px; color:var(--txt3); letter-spacing:2px; }
  .hero p b { color:var(--txt2); font-weight:500; }

  /* ── 对话输入（唯一炫彩焦点） ── */
  .chat { width:min(700px, 92%); }
  .chat-box { position:relative; border-radius:20px; padding:1px; background:linear-gradient(120deg, rgba(45,212,160,.7), rgba(67,198,232,.45) 35%, rgba(200,87,216,.4) 70%, rgba(232,193,90,.5)); transition:filter .25s, box-shadow .25s; }
  .chat-box::before { content:""; position:absolute; inset:-3px; border-radius:22px; background:inherit; filter:blur(16px); opacity:.5; z-index:-1; transition:opacity .25s; }
  .chat-box:hover::before, .chat-box:focus-within::before { opacity:.9; }
  .chat-box.dragover { filter:brightness(1.35); }
  .chat-in { background:linear-gradient(160deg, rgba(13,19,29,.94), rgba(9,13,20,.96)); backdrop-filter:blur(14px); border-radius:19px; }
  .chat-input { display:flex; align-items:flex-end; gap:10px; padding:16px 18px 10px; }
  .chat-input textarea { flex:1; background:none; border:none; outline:none; resize:none; color:var(--txt); font:inherit; font-size:14.5px; line-height:1.55; max-height:130px; }
  .chat-input textarea::placeholder { color:var(--txt3); }
  .chat-foot { display:flex; align-items:center; gap:6px; padding:8px 12px 13px; }
  .icon-btn { height:32px; padding:0 13px; border-radius:10px; display:flex; align-items:center; gap:7px; color:var(--txt2); cursor:pointer; font-size:12.5px; transition:all .14s; border:1px solid transparent; background:none; font-family:inherit; }
  .icon-btn:hover { background:rgba(120,160,200,.08); color:var(--txt); border-color:var(--line); }
  .send { margin-left:auto; width:36px; height:36px; border-radius:50%; border:none; background:linear-gradient(135deg,var(--em),var(--cy)); color:#04120c; font-size:16px; cursor:pointer; display:grid; place-items:center; font-weight:700; box-shadow:0 0 20px rgba(45,212,160,.45); transition:all .15s; }
  .send:hover { box-shadow:0 0 32px rgba(45,212,160,.7); transform:translateY(-1px); }
  .send:active { transform:scale(.94); }
  .send.disabled { background:rgba(120,140,170,.15); color:var(--txt3); box-shadow:none; cursor:default; }

  .hints { display:flex; justify-content:center; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .hint { font-size:12px; color:var(--txt3); border:1px solid rgba(120,160,200,.1); border-radius:14px; padding:5px 14px; cursor:pointer; transition:all .16s; background:rgba(14,20,30,.4); backdrop-filter:blur(8px); }
  .hint:hover { color:var(--txt2); border-color:rgba(45,212,160,.35); transform:translateY(-1px); }
  .hint::before { content:"◈ "; color:var(--em); opacity:.4; }

  .veil { position:fixed; inset:0; z-index:99; display:none; place-items:center; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(45,212,160,.07), rgba(5,7,12,.4));
    border:2px solid rgba(45,212,160,.55); box-shadow:inset 0 0 90px rgba(45,212,160,.15); }
  .veil.on { display:grid; }
  .veil span { font-size:16px; letter-spacing:4px; color:var(--em); text-shadow:0 0 20px rgba(45,212,160,.6); }
</style>
</head>
<body>

<div class="bg">
  <div class="aur a1"></div><div class="aur a2"></div><div class="aur a3"></div>
  <div class="stars"></div>
  <div class="grid"></div>
</div>

<header>
  <div class="logo"><div class="pt"></div><b>孔雀翎</b><span>MALACHITE</span></div>
  <div class="hright">
    <span class="status"><i></i>本机集群 · 就绪</span>
    <div class="avatar"></div>
  </div>
</header>

<main>
  <!-- 拖入图片后出现（出现时翎羽退隐） -->
  <div class="dropzone" id="dz">
    <div class="dz-frame">
      <img id="dzImg" src="" alt="">
      <div class="dz-tag" id="dzTag">参考图</div>
      <div class="dz-x" onclick="clearDz()">✕</div>
    </div>
  </div>

  <!-- 中央：若隐若现的孔雀翎 -->
  <div class="emblem" id="emblem">
    <div class="ring"></div>
    <svg viewBox="0 0 200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2dd4a0" stop-opacity=".8"/>
          <stop offset="1" stop-color="#43c6e8" stop-opacity=".25"/>
        </linearGradient>
        <radialGradient id="eye" cx=".5" cy=".45" r=".6">
          <stop offset="0" stop-color="#e8c15a" stop-opacity=".9"/>
          <stop offset=".38" stop-color="#c857d8" stop-opacity=".7"/>
          <stop offset=".72" stop-color="#2dd4a0" stop-opacity=".65"/>
          <stop offset="1" stop-color="#43c6e8" stop-opacity=".3"/>
        </radialGradient>
      </defs>
      <!-- 羽轴 -->
      <path d="M100 14 C 98 110, 100 210, 100 300" stroke="url(#shaft)" stroke-width="2.4" stroke-linecap="round"/>
      <!-- 羽枝（左右渐短） -->
      <g stroke="#2dd4a0" stroke-opacity=".3" stroke-width="1.2" stroke-linecap="round">
        <path d="M100 42 C 82 34, 64 30, 48 32"/><path d="M100 42 C 118 34, 136 30, 152 32"/>
        <path d="M100 62 C 78 54, 58 50, 40 53"/><path d="M100 62 C 122 54, 142 50, 160 53"/>
        <path d="M100 84 C 76 76, 54 72, 36 76"/><path d="M100 84 C 124 76, 146 72, 164 76"/>
        <path d="M100 108 C 74 100, 52 96, 34 101"/><path d="M100 108 C 126 100, 148 96, 166 101"/>
        <path d="M100 132 C 76 126, 56 122, 40 128"/><path d="M100 132 C 124 126, 144 122, 160 128"/>
        <path d="M100 156 C 78 151, 60 148, 46 153"/><path d="M100 156 C 122 151, 140 148, 154 153"/>
        <path d="M100 180 C 82 176, 68 174, 56 178"/><path d="M100 180 C 118 176, 132 174, 144 178"/>
      </g>
      <!-- 羽眼（孔雀翎的"眼"） -->
      <g transform="translate(100 64)">
        <ellipse rx="34" ry="40" fill="url(#eye)" opacity=".85"/>
        <ellipse rx="24" ry="28" fill="none" stroke="#e8c15a" stroke-opacity=".5" stroke-width="1.4"/>
        <ellipse rx="14" ry="16" fill="#0a1420" opacity=".8"/>
        <ellipse rx="7" ry="8" fill="#e8c15a" opacity=".9"/>
      </g>
      <!-- 底部散羽光 -->
      <g stroke="#43c6e8" stroke-opacity=".18" stroke-width="1" stroke-linecap="round">
        <path d="M100 236 C 90 252, 82 266, 80 282"/><path d="M100 236 C 110 252, 118 266, 120 282"/>
        <path d="M100 248 C 95 262, 92 272, 91 284"/><path d="M100 248 C 105 262, 108 272, 109 284"/>
      </g>
    </svg>
  </div>

  <div class="hero" id="hero">
    <h1>孔雀翎</h1>
    <p>说出你想要的画面，或<b>拖入一张图</b> — 智能体开始工作</p>
  </div>

  <div class="chat">
    <div class="chat-box" id="box">
      <div class="chat-in">
        <div class="chat-input">
          <textarea id="ta" rows="1" placeholder="描述你想要的图像…（支持拖入图片）"></textarea>
        </div>
        <div class="chat-foot">
          <button class="icon-btn" id="pick" title="上传图片">🖼 图片</button>
          <button class="icon-btn" title="工作流">⚙ 工作流</button>
          <button class="send disabled" id="send" title="发送">↑</button>
        </div>
      </div>
    </div>
    <div class="hints">
      <span class="hint">将军水墨立绘，背景留白</span>
      <span class="hint">把这张图转成赛博朋克风</span>
      <span class="hint">扩展画布到 16:9</span>
    </div>
  </div>
</main>

<div class="veil" id="veil"><span>松开 · 图片进入对话区</span></div>

<script>
  const ta = document.getElementById('ta');
  const box = document.getElementById('box');
  const send = document.getElementById('send');
  const dz = document.getElementById('dz');
  const dzImg = document.getElementById('dzImg');
  const dzTag = document.getElementById('dzTag');
  const veil = document.getElementById('veil');
  const hero = document.getElementById('hero');
  const emblem = document.getElementById('emblem');

  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 130) + 'px';
    send.classList.toggle('disabled', !ta.value.trim() && !dz.classList.contains('has'));
  });

  document.querySelectorAll('.hint').forEach(h => h.addEventListener('click', () => {
    ta.value = h.textContent.replace('◈ ',''); ta.dispatchEvent(new Event('input')); ta.focus();
  }));

  function clearDz() {
    dz.classList.remove('has'); dzImg.src = '';
    emblem.style.display = ''; emblem.classList.remove('dim');
    hero.style.display = '';
    send.classList.toggle('disabled', !ta.value.trim());
  }

  function setImage(file) {
    const r = new FileReader();
    r.onload = e => {
      dzImg.src = e.target.result;
      dzTag.textContent = file.name;
      dz.classList.add('has');
      emblem.style.display = 'none';
      send.classList.remove('disabled');
    };
    r.readAsDataURL(file);
  }

  let dragDepth = 0;
  window.addEventListener('dragenter', e => {
    e.preventDefault(); dragDepth++;
    if (e.dataTransfer.types.includes('Files')) { veil.classList.add('on'); box.classList.add('dragover'); }
  });
  window.addEventListener('dragleave', e => {
    e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; veil.classList.remove('on'); box.classList.remove('dragover'); }
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault(); dragDepth = 0; veil.classList.remove('on'); box.classList.remove('dragover');
    const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
    if (f) setImage(f);
  });

  document.getElementById('pick').addEventListener('click', () => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = 'image/*';
    i.onchange = () => i.files[0] && setImage(i.files[0]);
    i.click();
  });
</script>
</body>
</html>
